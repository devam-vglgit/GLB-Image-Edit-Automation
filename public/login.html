<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — GEM AI</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  }
  .card {
    width: 100%; max-width: 360px; background: #fff; border-radius: 14px;
    padding: 40px 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .logo { text-align: center; margin-bottom: 24px; font-weight: 700; font-size: 1.3rem; letter-spacing: 0.05em; }
  .logo-mark { color: #c9a24b; }
  h1 { font-size: 1.1rem; margin: 0 0 20px; text-align: center; color: #333; font-weight: 500; }
  label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 6px; margin-top: 16px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 0.95rem; outline: none; transition: border-color 0.15s;
  }
  input:focus { border-color: #c9a24b; }
  button {
    width: 100%; margin-top: 24px; padding: 11px; border: none; border-radius: 8px;
    background: #1a1a2e; color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: #fdecea;
    color: #b3261e; font-size: 0.85rem; display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="logo-mark">✦</span> GEM AI</div>
    <h1>Sign in to continue</h1>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <div class="error" id="error"></div>
      <button type="submit" id="submitBtn">Sign in</button>
    </form>
  </div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errBox = document.getElementById('error');
  errBox.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (res.ok && data.ok) {
      window.location.href = '/';
    } else {
      errBox.textContent = data.error || 'Sign in failed.';
      errBox.style.display = 'block';
    }
  } catch (err) {
    errBox.textContent = 'Could not reach the server.';
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
